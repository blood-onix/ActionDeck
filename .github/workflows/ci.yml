name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run compile
      - run: npm test

      - name: Package extension
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: actiondeck-vsix
          path: "*.vsix"
          retention-days: 14
